secrets:
  llm:
    - KIMI_API_KEY
    - GEMINI_API_KEY
    - FALLBACK_REASONING_MODEL_API_KEY

  supabase:
    - SUPABASE_ACCESS_TOKEN
    - SUPABASE_STAGING_PROJECT_REF
    - SUPABASE_PRODUCTION_PROJECT_REF
    - SUPABASE_SERVICE_ROLE_KEY_STAGING
    - SUPABASE_SERVICE_ROLE_KEY_PRODUCTION

  telegram:
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_ALLOWED_USER_IDS
    - TELEGRAM_ALLOWED_CHAT_IDS

rules:
  never_log:
    - "*API_KEY*"
    - "*TOKEN*"
    - "*SERVICE_ROLE*"
    - "*PASSWORD*"

  production_secrets:
    require_manual_approval: true
    inject_only_for:
      - "approved_production_deploy"
      - "approved_production_migration"
