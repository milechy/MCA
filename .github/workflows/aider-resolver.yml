# Aider Resolver — brain-routed, escalating, learning (2026-05-31).
#
# Issue `aider-fix` label → Aider runs on a GitHub-hosted runner → branch + PR
# → auto-merge (only if the test gate is GREEN). The model is NOT a fixed Claude
# default: the NemoClaw brain (scripts/ralph/ci-select-model.js) classifies the
# issue, consults the Cloudflare D1 learning store, and picks the cheapest model
# likely to succeed — escalating one rung per failed attempt (kimi → haiku →
# sonnet → gpt-5 → opus) until the work is implemented AND tests pass, or the
# ladder is exhausted (then it asks a human). Each attempt's outcome is written
# back to D1 so the next issue in the same context bucket learns from it.
#
# Cost: no per-issue model cap blocks completion; the escalation ladder is the
# bound (≤5 attempts). A high daily safety cap (AIDER_DAILY_CAP_USD, default
# $100) + a min-balance check are the only money guards.
#
# Secrets: PAT_TOKEN, PAT_USERNAME, LLM_API_KEY (=OPENROUTER_API_KEY),
#          TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, CLOUDFLARE_API_TOKEN
# Variables: CLOUDFLARE_ACCOUNT_ID, RALPH_D1_DATABASE_ID, AIDER_TEST_CMD,
#            AIDER_DAILY_CAP_USD, AIDER_AUTO_MERGE

name: Aider Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider-fix:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'aider-fix') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@aider-fix') &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TEST_CMD: ${{ vars.AIDER_TEST_CMD || 'npx playwright test --config playwright.ralph.config.js' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # NemoClaw D1 learning store — the brain reads recommendations + writes outcomes.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RALPH_D1_DATABASE_ID: ${{ vars.RALPH_D1_DATABASE_ID }}
      NEMOCLAW_CLASSIFIER_BACKEND: heuristic
      NEMOCLAW_CLASSIFIER_PYTHON: python3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Acknowledge on issue
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🛠️ Aider Resolver (brain-routed) picked up this issue — it will pick the cheapest capable model and escalate up to Opus until tests pass. Progress: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Pre-flight cost ceiling check
        id: cost_check
        env:
          DAILY_CAP_USD: ${{ vars.AIDER_DAILY_CAP_USD || '100.00' }}
          MIN_BALANCE_USD: ${{ vars.AIDER_MIN_BALANCE_USD || '1.00' }}
        run: |
          set -e
          KEY_INFO=$(curl -fsS -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key)
          CRED_INFO=$(curl -fsS -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/credits)
          DAILY=$(echo "$KEY_INFO" | jq -r '.data.usage_daily // 0')
          TOTAL_CREDITS=$(echo "$CRED_INFO" | jq -r '.data.total_credits // 0')
          TOTAL_USAGE=$(echo "$CRED_INFO" | jq -r '.data.total_usage // 0')
          BALANCE=$(awk -v c="$TOTAL_CREDITS" -v u="$TOTAL_USAGE" 'BEGIN{printf "%.6f\n", c - u}')
          echo "OpenRouter: usage_daily=\$$DAILY balance=\$$BALANCE cap_daily=\$$DAILY_CAP_USD min_balance=\$$MIN_BALANCE_USD"
          DAILY_OVER=$(awk -v d="$DAILY" -v c="$DAILY_CAP_USD" 'BEGIN{print (d >= c) ? 1 : 0}')
          BAL_LOW=$(awk -v b="$BALANCE" -v m="$MIN_BALANCE_USD" 'BEGIN{print (b < m) ? 1 : 0}')
          if [ "$DAILY_OVER" = "1" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⛔ Halted: OpenRouter usage_daily (\$$DAILY) ≥ safety cap AIDER_DAILY_CAP_USD (\$$DAILY_CAP_USD). Raise the repo variable to continue."
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            node scripts/ralph/notify-telegram.js "⛔ *Daily safety cap hit*: \$$DAILY ≥ \$$DAILY_CAP_USD. Aider halted on issue #$ISSUE_NUMBER." || true
            exit 0
          fi
          if [ "$BAL_LOW" = "1" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⛔ Halted: OpenRouter balance (\$$BALANCE) < AIDER_MIN_BALANCE_USD (\$$MIN_BALANCE_USD). Top up at https://openrouter.ai/credits."
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            node scripts/ralph/notify-telegram.js "⛔ *Low balance*: \$$BALANCE < \$$MIN_BALANCE_USD. Aider halted on issue #$ISSUE_NUMBER." || true
            exit 0
          fi
          echo "blocked=0" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.cost_check.outputs.blocked != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider + project deps
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat
          npm ci --prefer-offline --no-audit --fund=false
          npx playwright install --with-deps chromium 2>&1 | tail -5 || true

      - name: Configure git
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          git config --global user.email "${{ secrets.PAT_USERNAME }}@users.noreply.github.com"
          git config --global user.name  "${{ secrets.PAT_USERNAME }}"

      - name: Extract requested paths + build prompt
        if: steps.cost_check.outputs.blocked != '1'
        id: paths
        run: |
          jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH" > /tmp/title.txt
          jq -r '.issue.body  // ""' "$GITHUB_EVENT_PATH" > /tmp/body.txt
          grep -oE '`[A-Za-z0-9_./-]+\.(js|ts|tsx|jsx|md|py|yml|yaml|json|sh)`' /tmp/body.txt | tr -d '`' | sort -u > /tmp/paths.txt || true
          echo "csv=$(paste -sd ',' /tmp/paths.txt)" >> "$GITHUB_OUTPUT"
          {
            echo "You are working on a GitHub issue. Implement the change exactly as described."
            echo "Edit only the files needed. If tests are mentioned, write them."
            echo "Aider runs the test suite after each edit (--auto-test); fix any failures it"
            echo "reports before finishing. Prefer toBeCloseTo over toBe for fractional numbers."
            echo ""
            echo "--- Issue title ---"; cat /tmp/title.txt
            echo ""; echo "--- Issue body ---"; cat /tmp/body.txt
          } > /tmp/prompt_base.txt

      - name: Brain-routed escalating Aider loop
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          set +e
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BR="auto/issue-$ISSUE_NUMBER"
          TITLE="$(cat /tmp/title.txt)"
          PATHS_CSV="${{ steps.paths.outputs.csv }}"
          MAX_ATTEMPTS=5   # ladder length: kimi → haiku → sonnet → gpt-5 → opus
          LAST_FAILURE=""
          SUCCESS=0
          STORY_ID="issue-$ISSUE_NUMBER"

          for attempt in $(seq 0 $((MAX_ATTEMPTS-1))); do
            echo "::group::attempt $attempt"
            MODEL=$(node scripts/ralph/ci-select-model.js \
              --story-id "$STORY_ID" --title "$TITLE" --body-file /tmp/body.txt \
              --paths "$PATHS_CSV" --attempt "$attempt" --last-failure "$LAST_FAILURE" \
              --out /tmp/decision.json)
            SEL_EXIT=$?
            CTX_BUCKET=$(jq -r '.context_bucket // ""' /tmp/decision.json 2>/dev/null)
            DIFFICULTY=$(jq -r '.difficulty // ""' /tmp/decision.json 2>/dev/null)
            echo "brain decision: $(cat /tmp/decision.json 2>/dev/null)"
            echo "attempt $attempt → model=$MODEL"

            # Fresh branch from default each attempt (discard prior attempt's commits).
            git checkout -B "$BR" "origin/$DEFAULT_BRANCH"

            # On a retry, hand the stronger model the previous failure log.
            cp /tmp/prompt_base.txt /tmp/prompt.txt
            if [ "$attempt" -gt 0 ] && [ -s /tmp/gate.log ]; then
              { echo ""; echo "--- A weaker model's previous attempt FAILED its tests. Fix these: ---"; tail -40 /tmp/gate.log; } >> /tmp/prompt.txt
            fi

            if [ -s /tmp/paths.txt ]; then
              mapfile -t FILES < /tmp/paths.txt
              for f in "${FILES[@]}"; do [ -f "$f" ] || { mkdir -p "$(dirname "$f")"; touch "$f"; }; done
              aider --model "$MODEL" --yes --no-stream --no-show-model-warnings \
                --no-attribute-author --no-attribute-committer --no-attribute-co-authored-by \
                --auto-test --test-cmd "$TEST_CMD" --message-file /tmp/prompt.txt "${FILES[@]}" || true
            else
              aider --model "$MODEL" --yes --no-stream --no-show-model-warnings \
                --no-attribute-author --no-attribute-committer --no-attribute-co-authored-by \
                --auto-test --test-cmd "$TEST_CMD" --message-file /tmp/prompt.txt || true
            fi

            AHEAD=$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD")
            if [ "$AHEAD" -eq 0 ]; then
              echo "no diff produced"
              LAST_FAILURE="no_diff"
              node scripts/ralph/ci-record-outcome.js --story-id "$STORY_ID" --context-bucket "$CTX_BUCKET" --difficulty "$DIFFICULTY" --model "$MODEL" --attempt "$attempt" --succeeded false --failure-class no_diff || true
              echo "::endgroup::"
              [ "$SEL_EXIT" = "3" ] && break || continue
            fi

            echo "test gate: $TEST_CMD"
            if eval "$TEST_CMD" > /tmp/gate.log 2>&1; then
              echo "✅ test gate passed on attempt $attempt with $MODEL"
              node scripts/ralph/ci-record-outcome.js --story-id "$STORY_ID" --context-bucket "$CTX_BUCKET" --difficulty "$DIFFICULTY" --model "$MODEL" --attempt "$attempt" --succeeded true || true
              SUCCESS=1; WIN_MODEL="$MODEL"; WIN_ATTEMPT="$attempt"
              echo "::endgroup::"; break
            else
              echo "::warning::test gate failed on attempt $attempt with $MODEL"
              tail -20 /tmp/gate.log || true
              LAST_FAILURE="gate_failure"
              node scripts/ralph/ci-record-outcome.js --story-id "$STORY_ID" --context-bucket "$CTX_BUCKET" --difficulty "$DIFFICULTY" --model "$MODEL" --attempt "$attempt" --succeeded false --failure-class gate_failure || true
              echo "::endgroup::"
              [ "$SEL_EXIT" = "3" ] && break || continue
            fi
          done

          if [ "$SUCCESS" != "1" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⛔ Escalation exhausted (tried up to Opus) without a green implementation. Needs a human. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            node scripts/ralph/notify-telegram.js "⛔ Issue #$ISSUE_NUMBER: escalation exhausted (kimi→opus) without passing tests — needs human." || true
            exit 0
          fi

          # Success → push the winning attempt, open PR, auto-merge (gate already green).
          git push -u --force origin "$BR"
          {
            echo "Closes #${ISSUE_NUMBER}."
            echo ""
            echo "Generated by [Aider Resolver](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — NemoClaw brain picked \`$WIN_MODEL\` (succeeded on attempt $WIN_ATTEMPT)."
          } > /tmp/pr_body.md
          PR_URL=$(gh pr create --base "$DEFAULT_BRANCH" --head "$BR" --title "Auto-fix #${ISSUE_NUMBER}: $TITLE" --body-file /tmp/pr_body.md)
          PR_NUM=$(echo "$PR_URL" | sed -E 's|.*/pull/||')
          echo "PR opened: $PR_URL (model $WIN_MODEL)"

          if [ "${{ vars.AIDER_AUTO_MERGE || '1' }}" = "1" ]; then
            if gh pr merge "$PR_URL" --auto --squash --delete-branch 2>/tmp/auto_err.log; then
              node scripts/ralph/notify-telegram.js "🔵 PR #$PR_NUM (issue #$ISSUE_NUMBER) auto-merge pending — model \`$WIN_MODEL\` (attempt $WIN_ATTEMPT)" || true
            elif gh pr merge "$PR_URL" --squash --delete-branch 2>/tmp/imm_err.log; then
              node scripts/ralph/notify-telegram.js "✅ *Auto-merged* PR #$PR_NUM (issue #$ISSUE_NUMBER) — model \`$WIN_MODEL\` (attempt $WIN_ATTEMPT)" || true
            else
              cat /tmp/auto_err.log /tmp/imm_err.log
              node scripts/ralph/notify-telegram.js "⚠️ PR #$PR_NUM (issue #$ISSUE_NUMBER) could not auto-merge — needs manual review." || true
            fi
          else
            node scripts/ralph/notify-telegram.js "🔵 PR #$PR_NUM (issue #$ISSUE_NUMBER) — manual review (auto-merge off), model \`$WIN_MODEL\`" || true
          fi
