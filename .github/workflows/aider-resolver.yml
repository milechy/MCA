# Phase 9 #2: Aider-based autonomous PR creation.
#
# Replaces the broken OpenHands Resolver path (Phase 9 #1). Issue gets
# `aider-fix` label → Aider runs on GitHub-hosted runner → branch + PR.
#
# Why Aider:
#   - active OSS (45k★, last push 2026-05-22), maintained, no upstream
#     deprecation
#   - LiteLLM under the hood = same OpenRouter slug format we already use
#     for Ralph (openrouter/anthropic/claude-haiku-4.5 etc.)
#   - simple CLI: read prompt + files in, edit files + git commit out
#   - no Python-module-not-found class of upstream breakage (Aider's whole
#     reason for existing IS the CLI surface)
#
# Inputs:
#   Secrets — already set for Phase 9 #1:
#     PAT_TOKEN, PAT_USERNAME, LLM_API_KEY (= OPENROUTER_API_KEY)
#   Variables — already set:
#     LLM_MODEL (default: openrouter/anthropic/claude-haiku-4.5)
#
# Behaviour:
#   1. Extract any `path/to/file.ext` style backquoted paths from the
#      issue body — those are the files Aider will edit.
#   2. Create a feature branch `auto/issue-<N>`.
#   3. Aider runs headless with the full issue body as prompt, those
#      files in scope, autonomously commits its diff (one commit).
#   4. If anything changed, push the branch and open a PR targeting
#      the repo default branch (`infra/phase0-autonomous-foundation`).
#   5. If nothing changed, comment on the issue.
#
# Cost cap: Aider doesn't have a hard $-cap flag. We rely on the model
# choice (Haiku 4.5 default ≈ $0.05–0.20/PR) plus the implicit 10-minute
# step timeout below. If Aider tries to runaway it'll be killed.

name: Aider Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider-fix:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'aider-fix') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@aider-fix') &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
      # PAT used both for checkout (so the push event re-triggers CI) and for `gh`.
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MODEL: ${{ vars.LLM_MODEL || 'openrouter/anthropic/claude-haiku-4.5' }}
      # Aider runs this after each edit (via --auto-test). Keep it scoped to
      # the ralph suite so we don't pay for the full repo's e2e tests on
      # every iteration; if the issue touches non-ralph code, override via
      # repo variable AIDER_TEST_CMD.
      TEST_CMD: ${{ vars.AIDER_TEST_CMD || 'npx playwright test --config playwright.ralph.config.js' }}
      # Phase 13 #1: outbound Telegram notifications (best-effort no-op if unset).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Acknowledge on issue
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🛠️ Aider Resolver picked up this issue. Model: \`$MODEL\`. Watch progress: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Pre-flight cost ceiling check
        # Parallel to Ralph's kimi-cost-tracker.isOverBudget() but for the
        # Actions path: ask OpenRouter directly. Two gates:
        #   1. Daily-spend cap (this key) — default $5/day, override via repo
        #      variable AIDER_DAILY_CAP_USD. Comparable to Ralph's
        #      RALPH_KIMI_DAILY_BUDGET_USD.
        #   2. Minimum residual balance (account total) — default $1, override
        #      via AIDER_MIN_BALANCE_USD. Prevents Aider running on an empty
        #      account and racking up no-credit error spam.
        # Either tripping → set step output `blocked=1`; downstream steps
        # gate on it. Step itself succeeds so the workflow stays green
        # (not a failure — the issue is bookkeeping, not a bug).
        id: cost_check
        env:
          DAILY_CAP_USD: ${{ vars.AIDER_DAILY_CAP_USD || '5.00' }}
          MIN_BALANCE_USD: ${{ vars.AIDER_MIN_BALANCE_USD || '1.00' }}
        run: |
          set -e
          KEY_INFO=$(curl -fsS -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/key)
          CRED_INFO=$(curl -fsS -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/credits)

          DAILY=$(echo "$KEY_INFO" | jq -r '.data.usage_daily // 0')
          TOTAL_CREDITS=$(echo "$CRED_INFO" | jq -r '.data.total_credits // 0')
          TOTAL_USAGE=$(echo "$CRED_INFO" | jq -r '.data.total_usage // 0')
          BALANCE=$(awk -v c="$TOTAL_CREDITS" -v u="$TOTAL_USAGE" 'BEGIN{printf "%.6f\n", c - u}')

          echo "OpenRouter snapshot: usage_daily=\$$DAILY balance=\$$BALANCE cap_daily=\$$DAILY_CAP_USD min_balance=\$$MIN_BALANCE_USD"

          # Numeric comparison via awk so floats compare correctly.
          DAILY_OVER=$(awk -v d="$DAILY" -v c="$DAILY_CAP_USD" 'BEGIN{print (d >= c) ? 1 : 0}')
          BAL_LOW=$(awk -v b="$BALANCE" -v m="$MIN_BALANCE_USD" 'BEGIN{print (b < m) ? 1 : 0}')

          if [ "$DAILY_OVER" = "1" ]; then
            gh issue comment "$ISSUE_NUMBER" --body \
              "⛔ Aider Resolver halted: OpenRouter usage_daily (\$$DAILY) ≥ AIDER_DAILY_CAP_USD (\$$DAILY_CAP_USD). Try again tomorrow or raise the cap via repo variable."
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            echo "::notice::cost ceiling: daily cap hit (\$$DAILY ≥ \$$DAILY_CAP_USD)"
            node scripts/ralph/notify-telegram.js "⛔ *Cost ceiling hit* (daily): \$$DAILY ≥ \$$DAILY_CAP_USD. Aider halted on issue #$ISSUE_NUMBER." || true
            exit 0
          fi
          if [ "$BAL_LOW" = "1" ]; then
            gh issue comment "$ISSUE_NUMBER" --body \
              "⛔ Aider Resolver halted: OpenRouter balance (\$$BALANCE) < AIDER_MIN_BALANCE_USD (\$$MIN_BALANCE_USD). Top up at https://openrouter.ai/credits."
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            echo "::notice::cost ceiling: low balance (\$$BALANCE < \$$MIN_BALANCE_USD)"
            node scripts/ralph/notify-telegram.js "⛔ *Low balance*: \$$BALANCE < \$$MIN_BALANCE_USD. Aider halted on issue #$ISSUE_NUMBER — top up OpenRouter." || true
            exit 0
          fi
          echo "blocked=0" >> "$GITHUB_OUTPUT"
          echo "cost ceiling: OK — proceed."

      - name: Set up Python
        if: steps.cost_check.outputs.blocked != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider + project deps for --auto-test
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat
          # npm deps for Playwright test runner (Aider's --auto-test invokes them)
          npm ci --prefer-offline --no-audit --fund=false
          npx playwright install --with-deps chromium 2>&1 | tail -5 || true

      - name: Configure git
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          git config --global user.email "${{ secrets.PAT_USERNAME }}@users.noreply.github.com"
          git config --global user.name  "${{ secrets.PAT_USERNAME }}"

      - name: Extract requested paths from issue body
        if: steps.cost_check.outputs.blocked != '1'
        id: paths
        run: |
          # Convention: any path in backticks like `src/foo.js` is treated as
          # a target file. Filters to plausible code paths (has extension and
          # at least one slash, OR matches a top-level file we whitelist).
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > /tmp/body.txt
          grep -oE '`[A-Za-z0-9_./-]+\.(js|ts|tsx|jsx|md|py|yml|yaml|json|sh)`' /tmp/body.txt \
            | tr -d '`' | sort -u > /tmp/paths.txt || true
          echo "extracted paths:"
          cat /tmp/paths.txt || true
          # Comma-separated for later steps' logging only
          paths_csv=$(paste -sd ',' /tmp/paths.txt)
          echo "csv=$paths_csv" >> "$GITHUB_OUTPUT"

      - name: Create work branch
        if: steps.cost_check.outputs.blocked != '1'
        id: branch
        run: |
          BR="auto/issue-$ISSUE_NUMBER"
          # Re-trigger safety: if branch exists remotely, start fresh from default.
          git checkout -B "$BR" "origin/${{ github.event.repository.default_branch }}"
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Write Aider prompt
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          {
            echo "You are working on a GitHub issue. The full text of the issue is below."
            echo ""
            echo "Please implement the change exactly as described. Edit only the files needed."
            echo "If tests are mentioned, write them."
            echo ""
            echo "The test runner is configured via Aider's --auto-test. After each edit,"
            echo "Aider will run \`npx playwright test\` automatically and surface failures"
            echo "back to you. Fix any test failures it reports before considering the work"
            echo "complete. Pay attention to floating-point comparisons — prefer"
            echo "toBeCloseTo over toBe for fractional numbers."
            echo ""
            echo "Make commits as needed; Aider's default is one commit per response."
            echo ""
            echo "--- Issue title ---"
            jq -r '.issue.title' "$GITHUB_EVENT_PATH"
            echo ""
            echo "--- Issue body ---"
            cat /tmp/body.txt
          } > /tmp/prompt.txt
          echo '--- prompt preview (first 80 lines) ---'
          head -80 /tmp/prompt.txt

      - name: Run Aider
        if: steps.cost_check.outputs.blocked != '1'
        id: aider
        run: |
          set -e
          # If we extracted paths, pass them. If not, just give Aider the prompt
          # and let it discover via its repo-map.
          if [ -s /tmp/paths.txt ]; then
            mapfile -t FILES < /tmp/paths.txt
            # Create missing files so Aider can "edit" them (Aider can also CREATE,
            # but it's friendlier to pre-touch new files).
            for f in "${FILES[@]}"; do
              if [ ! -f "$f" ]; then mkdir -p "$(dirname "$f")"; touch "$f"; fi
            done
            aider \
              --model "$MODEL" \
              --yes \
              --no-stream \
              --no-show-model-warnings \
              --no-attribute-author --no-attribute-committer --no-attribute-co-authored-by \
              --auto-test \
              --test-cmd "$TEST_CMD" \
              --message-file /tmp/prompt.txt \
              "${FILES[@]}"
          else
            aider \
              --model "$MODEL" \
              --yes \
              --no-stream \
              --no-show-model-warnings \
              --no-attribute-author --no-attribute-committer --no-attribute-co-authored-by \
              --auto-test \
              --test-cmd "$TEST_CMD" \
              --message-file /tmp/prompt.txt
          fi

      - name: Open PR (or comment if no changes)
        if: steps.cost_check.outputs.blocked != '1'
        run: |
          set -e
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BR="${{ steps.branch.outputs.name }}"
          AHEAD=$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD")
          echo "commits ahead of $DEFAULT_BRANCH: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "Aider produced no diff on this attempt. Manual investigation needed. Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 0
          fi
          # --force so re-runs against the same issue can re-push cleanly.
          # We deliberately don't use --force-with-lease: the local branch
          # is always carved fresh from origin/$DEFAULT_BRANCH earlier in
          # the job and has no tracking history, so a lease check has
          # nothing to compare against. The branch namespace auto/issue-<N>
          # is owned exclusively by this workflow; no risk of clobbering a
          # parallel human contribution there.
          git push -u --force origin "$BR"
          {
            echo "Closes #${ISSUE_NUMBER}."
            echo ""
            echo "Generated by [Aider Resolver](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) using \`$MODEL\`."
            echo ""
            echo "Paths extracted from issue body: \`${{ steps.paths.outputs.csv }}\`"
          } > /tmp/pr_body.md
          PR_URL=$(gh pr create \
            --base  "$DEFAULT_BRANCH" \
            --head  "$BR" \
            --title "Auto-fix #${ISSUE_NUMBER}: $(jq -r '.issue.title' "$GITHUB_EVENT_PATH")" \
            --body-file /tmp/pr_body.md)
          echo "PR opened: $PR_URL"
          PR_NUM=$(echo "$PR_URL" | sed -E 's|.*/pull/||')

          # Phase 16: HARD TEST GATE before merge. Aider's --auto-test iterates
          # during generation but does NOT block merge — so a red suite (e.g.
          # the queue/pool/report chain that merged with a wrong import path +
          # async/sync mismatch) used to land on main. Now we re-run the
          # project's test command against the pushed branch; only a GREEN
          # suite is allowed to merge. Red → leave the PR open for review +
          # notify, never merge.
          echo "running test gate: $TEST_CMD"
          if eval "$TEST_CMD" > /tmp/gate.log 2>&1; then
            echo "✅ test gate passed"
            TEST_GATE=pass
          else
            echo "::warning::test gate FAILED — PR left open, not merging"
            tail -30 /tmp/gate.log || true
            TEST_GATE=fail
          fi
          if [ "$TEST_GATE" = "fail" ]; then
            gh pr comment "$PR_URL" --body "⛔ Auto-merge blocked: the test suite is failing on this branch. Left open for review. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            node scripts/ralph/notify-telegram.js "⛔ PR #$PR_NUM (issue #$ISSUE_NUMBER) opened but *tests fail* — not merged, needs review." || true
            exit 0
          fi

          # Phase 9 #6 / #6b / #6c: enable auto-merge so the PR squash-merges
          # itself.  History:
          #   #6:  call `gh pr merge --auto`. Failed silently with "clean status"
          #        when repo had no required checks (PR #216 evidence).
          #   #6b: detect "clean status" string in stderr, fall back to immediate
          #        merge. Worked for PR #218, #221, #223+, etc.
          #   #6c: GitHub returns *two* different GraphQL messages for the same
          #        logical "no required checks" condition: "Pull request is in
          #        clean status" AND "Protected branch rules not configured for
          #        this branch". PR #222 (range) and #226 (zip) hit the second
          #        variant and got stuck open.
          # Simplification: stop trying to discriminate by error message. Any
          # --auto failure → immediately attempt a plain merge. If THAT fails
          # too, leave the PR open and warn.
          #
          # Opt-out via repo variable AIDER_AUTO_MERGE=0 (operator escape
          # hatch for issues they want to review by hand).
          # (PR_NUM + the test gate were computed above; reaching here means GREEN.)
          if [ "${{ vars.AIDER_AUTO_MERGE || '1' }}" = "1" ]; then
            if gh pr merge "$PR_URL" --auto --squash --delete-branch 2>/tmp/auto_err.log; then
              echo "auto-merge enabled — will merge when checks pass"
              node scripts/ralph/notify-telegram.js "🔵 PR #$PR_NUM opened for issue #$ISSUE_NUMBER (auto-merge pending) — model \`$MODEL\`" || true
            else
              echo "auto-merge unavailable; trying immediate merge"
              cat /tmp/auto_err.log
              if gh pr merge "$PR_URL" --squash --delete-branch 2>/tmp/imm_err.log; then
                echo "immediate-merge succeeded"
                node scripts/ralph/notify-telegram.js "✅ *Auto-merged* PR #$PR_NUM (issue #$ISSUE_NUMBER) — model \`$MODEL\`" || true
              else
                echo "::warning::both --auto and immediate merge failed; PR left open"
                cat /tmp/imm_err.log
                node scripts/ralph/notify-telegram.js "⚠️ PR #$PR_NUM (issue #$ISSUE_NUMBER) could not auto-merge — needs manual review." || true
              fi
            fi
          else
            echo "AIDER_AUTO_MERGE=0 — leaving PR open for manual review."
            node scripts/ralph/notify-telegram.js "🔵 PR #$PR_NUM opened for issue #$ISSUE_NUMBER — manual review (auto-merge off)" || true
          fi
