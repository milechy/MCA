# Phase 9 #2: Aider-based autonomous PR creation.
#
# Replaces the broken OpenHands Resolver path (Phase 9 #1). Issue gets
# `aider-fix` label → Aider runs on GitHub-hosted runner → branch + PR.
#
# Why Aider:
#   - active OSS (45k★, last push 2026-05-22), maintained, no upstream
#     deprecation
#   - LiteLLM under the hood = same OpenRouter slug format we already use
#     for Ralph (openrouter/anthropic/claude-haiku-4.5 etc.)
#   - simple CLI: read prompt + files in, edit files + git commit out
#   - no Python-module-not-found class of upstream breakage (Aider's whole
#     reason for existing IS the CLI surface)
#
# Inputs:
#   Secrets — already set for Phase 9 #1:
#     PAT_TOKEN, PAT_USERNAME, LLM_API_KEY (= OPENROUTER_API_KEY)
#   Variables — already set:
#     LLM_MODEL (default: openrouter/anthropic/claude-haiku-4.5)
#
# Behaviour:
#   1. Extract any `path/to/file.ext` style backquoted paths from the
#      issue body — those are the files Aider will edit.
#   2. Create a feature branch `auto/issue-<N>`.
#   3. Aider runs headless with the full issue body as prompt, those
#      files in scope, autonomously commits its diff (one commit).
#   4. If anything changed, push the branch and open a PR targeting
#      the repo default branch (`infra/phase0-autonomous-foundation`).
#   5. If nothing changed, comment on the issue.
#
# Cost cap: Aider doesn't have a hard $-cap flag. We rely on the model
# choice (Haiku 4.5 default ≈ $0.05–0.20/PR) plus the implicit 10-minute
# step timeout below. If Aider tries to runaway it'll be killed.

name: Aider Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider-fix:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'aider-fix') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@aider-fix') &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
      # PAT used both for checkout (so the push event re-triggers CI) and for `gh`.
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MODEL: ${{ vars.LLM_MODEL || 'openrouter/anthropic/claude-haiku-4.5' }}
      # Aider runs this after each edit (via --auto-test). Keep it scoped to
      # the ralph suite so we don't pay for the full repo's e2e tests on
      # every iteration; if the issue touches non-ralph code, override via
      # repo variable AIDER_TEST_CMD.
      TEST_CMD: ${{ vars.AIDER_TEST_CMD || 'npx playwright test --config playwright.ralph.config.js' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider + project deps for --auto-test
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat
          # npm deps for Playwright test runner (Aider's --auto-test invokes them)
          npm ci --prefer-offline --no-audit --fund=false
          npx playwright install --with-deps chromium 2>&1 | tail -5 || true

      - name: Configure git
        run: |
          git config --global user.email "${{ secrets.PAT_USERNAME }}@users.noreply.github.com"
          git config --global user.name  "${{ secrets.PAT_USERNAME }}"

      - name: Acknowledge on issue
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🛠️ Aider Resolver picked up this issue. Model: \`$MODEL\`. Watch progress: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Extract requested paths from issue body
        id: paths
        run: |
          # Convention: any path in backticks like `src/foo.js` is treated as
          # a target file. Filters to plausible code paths (has extension and
          # at least one slash, OR matches a top-level file we whitelist).
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > /tmp/body.txt
          grep -oE '`[A-Za-z0-9_./-]+\.(js|ts|tsx|jsx|md|py|yml|yaml|json|sh)`' /tmp/body.txt \
            | tr -d '`' | sort -u > /tmp/paths.txt || true
          echo "extracted paths:"
          cat /tmp/paths.txt || true
          # Comma-separated for later steps' logging only
          paths_csv=$(paste -sd ',' /tmp/paths.txt)
          echo "csv=$paths_csv" >> "$GITHUB_OUTPUT"

      - name: Create work branch
        id: branch
        run: |
          BR="auto/issue-$ISSUE_NUMBER"
          # Re-trigger safety: if branch exists remotely, start fresh from default.
          git checkout -B "$BR" "origin/${{ github.event.repository.default_branch }}"
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Write Aider prompt
        run: |
          {
            echo "You are working on a GitHub issue. The full text of the issue is below."
            echo ""
            echo "Please implement the change exactly as described. Edit only the files needed."
            echo "If tests are mentioned, write them."
            echo ""
            echo "The test runner is configured via Aider's --auto-test. After each edit,"
            echo "Aider will run \`npx playwright test\` automatically and surface failures"
            echo "back to you. Fix any test failures it reports before considering the work"
            echo "complete. Pay attention to floating-point comparisons — prefer"
            echo "toBeCloseTo over toBe for fractional numbers."
            echo ""
            echo "Make commits as needed; Aider's default is one commit per response."
            echo ""
            echo "--- Issue title ---"
            jq -r '.issue.title' "$GITHUB_EVENT_PATH"
            echo ""
            echo "--- Issue body ---"
            cat /tmp/body.txt
          } > /tmp/prompt.txt
          echo '--- prompt preview (first 80 lines) ---'
          head -80 /tmp/prompt.txt

      - name: Run Aider
        id: aider
        run: |
          set -e
          # If we extracted paths, pass them. If not, just give Aider the prompt
          # and let it discover via its repo-map.
          if [ -s /tmp/paths.txt ]; then
            mapfile -t FILES < /tmp/paths.txt
            # Create missing files so Aider can "edit" them (Aider can also CREATE,
            # but it's friendlier to pre-touch new files).
            for f in "${FILES[@]}"; do
              if [ ! -f "$f" ]; then mkdir -p "$(dirname "$f")"; touch "$f"; fi
            done
            aider \
              --model "$MODEL" \
              --yes \
              --no-stream \
              --no-show-model-warnings \
              --no-attribute-author --no-attribute-committer --no-attribute-co-authored-by \
              --auto-test \
              --test-cmd "$TEST_CMD" \
              --message-file /tmp/prompt.txt \
              "${FILES[@]}"
          else
            aider \
              --model "$MODEL" \
              --yes \
              --no-stream \
              --no-show-model-warnings \
              --no-attribute-author --no-attribute-committer --no-attribute-co-authored-by \
              --auto-test \
              --test-cmd "$TEST_CMD" \
              --message-file /tmp/prompt.txt
          fi

      - name: Open PR (or comment if no changes)
        run: |
          set -e
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BR="${{ steps.branch.outputs.name }}"
          AHEAD=$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD")
          echo "commits ahead of $DEFAULT_BRANCH: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "Aider produced no diff on this attempt. Manual investigation needed. Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 0
          fi
          git push -u origin "$BR"
          {
            echo "Closes #${ISSUE_NUMBER}."
            echo ""
            echo "Generated by [Aider Resolver](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) using \`$MODEL\`."
            echo ""
            echo "Paths extracted from issue body: \`${{ steps.paths.outputs.csv }}\`"
          } > /tmp/pr_body.md
          gh pr create \
            --base  "$DEFAULT_BRANCH" \
            --head  "$BR" \
            --title "Auto-fix #${ISSUE_NUMBER}: $(jq -r '.issue.title' "$GITHUB_EVENT_PATH")" \
            --body-file /tmp/pr_body.md
