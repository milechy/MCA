name: Phase 4 Telegram Smoke Safety

on:
  pull_request:
    branches:
      - infra/phase0-autonomous-foundation
  push:
    branches:
      - infra/phase0-autonomous-foundation

permissions:
  contents: read

jobs:
  telegram-smoke-safety:
    name: Telegram smoke safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true
      RALPH_TELEGRAM_RUN_ALL_ENABLED: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check Telegram helper environment stays default-off
        run: npm run telegram:check-env || true

      - name: Inspect Telegram logs safely
        run: npm run telegram:inspect-logs

      - name: Run Ralph tests
        run: npm run test:ralph

      - name: Run Telegram tests
        run: npm run test:telegram
