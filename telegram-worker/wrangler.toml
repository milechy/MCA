name = "ralph-telegram-nl"
main = "index.mjs"
compatibility_date = "2026-05-01"
# global fetch + URLSearchParams are available on the modern Workers runtime.

# Secrets (DO NOT put values here — set via `wrangler secret put`, see README.md):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   ALLOWED_CHAT_ID
#   GITHUB_PAT
#   GITHUB_REPO
#   OPENROUTER_API_KEY

# Non-secret default; override with `wrangler secret put LLM_MODEL` if desired.
# BARE slug (no openrouter/ prefix) — the Worker calls the OpenRouter API
# directly, which rejects the prefixed form.
[vars]
LLM_MODEL = "anthropic/claude-haiku-4.5"

# Phase 15 #2: KV namespace for requirements-refinement conversation state.
# Created via MCP (id below). For local dev `wrangler kv namespace create`
# makes another; keep prod id here.
[[kv_namespaces]]
binding = "REFINE_KV"
id = "8ace6eac1e6e4caa8e14b54f0db6575d"
